[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BigFingerprint"
version = "0.2.0"
description = "Polymer fingerprints and BigSMARTS matching for BigSMILES structures"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "networkx>=2.8",
    "numpy>=1.23",
    "rdkit>=2022.9",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
debug = [
    "matplotlib>=3.5",
    "xlwt>=1.3.0",
]
test = ["pytest>=7"]

[project.scripts]
bigfingerprint = "bigfingerprint.cli:main"

[project.urls]
Homepage = "https://github.com/shijiale0609/BigFingerprint"
Repository = "https://github.com/shijiale0609/BigFingerprint.git"

[tool.setuptools]
packages = ["bigfingerprint"]
package-dir = {bigfingerprint = "script"}
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
